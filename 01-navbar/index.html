<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Navbar</title>
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"
      integrity="sha512-oJ8QbaQThQoJZ7oEv+29jfPM6CcP+zUxh3PKJs1vyOhx0UraUrE7PQgeItu3dOuCJyrzWpoYMsVjkkPEBzbUqw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a href="#" class="logo">Logo</a>

        <ul class="nav-links" id="navLinks">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Portfolio</a></li>
          <li><a href="#">Contact</a></li>
        </ul>

        <button class="menu-btn" id="menuBtn">☰</button>
      </div>
    </nav>

    <div class="hero">
      <h1>Welcome to the Responsive Navbar Example</h1>
      <p>
        This is a simple example of a responsive navigation bar using HTML, CSS,
        and JavaScript. Resize the browser window to see how the navbar adapts
        to different screen sizes.
      </p>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
